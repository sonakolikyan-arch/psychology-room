<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Serenity Clinic</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   BASE
========================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  background: #f4f6f8;
  color: #1c1c1e;
  line-height: 1.6;
}

/* =========================
   HERO (IMAGE)
========================= */
.hero {
  position: relative;
  min-height: 92vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 120px 20px;
  overflow: hidden;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: url("https://images.unsplash.com/photo-1527137342181-19aab11a8ee8?auto=format&fit=crop&w=2000&q=80")
              center/cover no-repeat;
  z-index: -2;
  filter: brightness(0.70) contrast(1.15);
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(0,0,0,0.40),
    rgba(255,255,255,0.10)
  );
  z-index: -1;
}

.hero h1 {
  font-size: 58px;
  font-weight: 700;
  color: white;
}

.hero p {
  margin-top: 20px;
  font-size: 18px;
  color: rgba(255,255,255,0.85);
  max-width: 650px;
  margin-left: auto;
  margin-right: auto;
}

.cta {
  margin-top: 30px;
  display: inline-block;
  padding: 14px 30px;
  border-radius: 999px;
  background: white;
  color: #111;
  font-weight: 600;
  text-decoration: none;
}

/* =========================
   FLOATING CHAT WIDGET
========================= */
.chat-widget {
  position: fixed;
  bottom: 25px;
  right: 25px;
  z-index: 999;
}

/* chat button */
.chat-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #1c1c1e;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  transition: 0.3s ease;
}

.chat-btn:hover {
  transform: scale(1.05);
}

/* chat panel */
.chat-box {
  position: absolute;
  bottom: 75px;
  right: 0;
  width: 300px;
  background: white;
  border-radius: 18px;
  box-shadow: 0 25px 60px rgba(0,0,0,0.15);
  padding: 15px;

  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
  transition: 0.3s ease;
}

/* show on hover */
.chat-widget:hover .chat-box {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.chat-box h4 {
  font-size: 15px;
  margin-bottom: 6px;
}

.chat-box p {
  font-size: 13px;
  color: #666;
  margin-bottom: 10px;
}

.chat-box input {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ddd;
  outline: none;
}

.chat-box button {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: #1c1c1e;
  color: white;
  cursor: pointer;
}

/* =========================
   REST OF PAGE (UNCHANGED)
========================= */
.section-title {
  text-align: center;
  font-size: 36px;
  font-weight: 700;
  margin: 80px 0 40px;
}

.glass {
  background: rgba(255,255,255,0.65);
  border-radius: 20px;
  backdrop-filter: blur(14px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}

.stats, .grid, .cards, .feedback-grid, .contact-box {
  width: 92%;
  max-width: 1150px;
  margin: auto;
}

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }

.profile img {
  width: 100%;
  height: 230px;
  object-fit: cover;
  border-radius: 20px 20px 0 0;
}

.profile-content {
  padding: 20px;
  text-align: center;
}

.book-btn {
  margin-top: 15px;
  display: inline-block;
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  background: #1c1c1e;
  color: white;
  text-decoration: none;
}

</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <div>
    <h1>Modern psychological care</h1>
    <p>Confidential therapy designed for emotional balance and clarity.</p>
    <a class="cta" href="#contact">Book Appointment</a>
  </div>
</section>

<!-- =========================
     FLOATING CHAT WIDGET
========================= -->
<div class="chat-widget">

  <div class="chat-box">
    <h4>Chat with a therapist</h4>
    <p>We respond within a few minutes.</p>
    <input type="text" placeholder="Type your message...">
    <button>Send</button>
  </div>

  <div class="chat-btn">💬</div>

</div>

</body>
</html>
