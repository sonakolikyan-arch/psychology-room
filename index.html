<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Serenity Clinic</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   BASE
========================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  background: #f4f6f8;
  color: #1c1c1e;
}

/* =========================
   HERO VIDEO
========================= */
.hero {
  position: relative;
  min-height: 92vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
  padding: 120px 20px;
}

/* VIDEO BACKGROUND */
.hero video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
  filter: brightness(0.7) contrast(1.1);
}

/* OVERLAY */
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(0,0,0,0.35),
    rgba(255,255,255,0.15)
  );
  z-index: -1;
}

.hero h1 {
  font-size: 56px;
  font-weight: 700;
  color: white;
}

.hero p {
  margin-top: 20px;
  font-size: 18px;
  color: rgba(255,255,255,0.85);
  max-width: 600px;
  margin: auto;
}

.cta {
  margin-top: 30px;
  display: inline-block;
  padding: 14px 30px;
  border-radius: 999px;
  background: white;
  color: black;
  font-weight: 600;
  text-decoration: none;
}

/* =========================
   MAP SECTION
========================= */
.map-section {
  margin: 80px auto;
  text-align: center;
}

.map-title {
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 30px;
}

.map-box {
  width: 92%;
  max-width: 1100px;
  margin: auto;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,0.15);
}

.map-box iframe {
  width: 100%;
  height: 450px;
  border: 0;
}

</style>
</head>

<body>

<!-- =========================
     HERO WITH VIDEO
========================= -->
<section class="hero">

  <!-- 🔥 CINEMATIC VIDEO -->
  <video autoplay muted loop playsinline>
    <source src="https://cdn.coverr.co/videos/coverr-a-woman-talking-to-a-therapist-7317/1080p.mp4" type="video/mp4">
  </video>

  <div>
    <h1>Modern psychological care</h1>
    <p>Confidential therapy in a calm, supportive environment designed for healing and clarity.</p>
    <a href="#contact" class="cta">Book Appointment</a>
  </div>

</section>

<!-- =========================
     MAP SECTION (TUMANYAN 20)
========================= -->
<section class="map-section">

  <div class="map-title">Our Location</div>

  <div class="map-box">
    <iframe
      src="https://www.google.com/maps?q=Tumanyan%2020,%20Yerevan,%20Armenia&output=embed">
    </iframe>
  </div>

</section>

</body>
</html>
