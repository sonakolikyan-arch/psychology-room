<!DOCTYPE html> 
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mindful Spaces Psychotherapy</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ================= ROOT VARIABLES & BRAND PALETTE ================= */

:root {
  --primary: #4a5d4e;
  --primary-hover: #3d4d40;
  --secondary: #c2a68f;
  --secondary-light: #f4ede4;
  --dark: #2c2520;
  --text: #4a403a;
  --muted: #7a7069;
  --bg: #faf7f2;
  --card-bg: #ffffff;
  --max-width: 1200px;
}

/* ================= GLOBAL RESET ================= */

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background-color: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  line-height: 1.7;
}

/* ================= HERO IMAGE (FIRST IMAGE) ================= */

.hero-image-placeholder {
  width: 100%;
  max-width: 500px;
  height: 550px;
  border-radius: 40px 40px 0px 40px;
  background-image: url('https://cdn.shopify.com/s/files/1/0767/2279/8744/files/IMG_7728.jpg?v=1779877237');
  background-size: cover;
  background-position: center;
  box-shadow: 0 30px 60px rgba(44, 37, 32, 0.1);
}

/* ================= ABOUT IMAGE (SECOND IMAGE UPDATED) ================= */

.about-image {
  flex: 1;
  min-width: 400px;
  height: 450px;
  border-radius: 24px;
  background-image: url('https://cdn.shopify.com/s/files/1/0767/2279/8744/files/IMG_7729.jpg?v=1779877236');
  background-size: cover;
  background-position: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.03);
}

/* (rest of your CSS stays exactly the same) */

</style>
</head>

<body>

<!-- HERO -->
<div class="hero-image-placeholder"></div>

<!-- ABOUT -->
<div class="about-image"></div>

</body>
</html>
