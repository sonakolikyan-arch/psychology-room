<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Serenity Clinic</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   BASE
========================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  background: #f4f6f8;
  color: #1c1c1e;
  line-height: 1.6;
}

/* =========================
   HERO (NOW IMAGE INSTEAD OF VIDEO)
========================= */
.hero {
  position: relative;
  min-height: 92vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 120px 20px;
  overflow: hidden;
}

/* 🖼️ HERO IMAGE */
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: url("https://images.unsplash.com/photo-1527137342181-19aab11a8ee8?auto=format&fit=crop&w=2000&q=80")
              center/cover no-repeat;
  z-index: -2;
  filter: brightness(0.70) contrast(1.15);
}

/* 🌫️ OVERLAY FOR READABILITY */
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(0,0,0,0.40),
    rgba(255,255,255,0.10)
  );
  z-index: -1;
}

.hero h1 {
  font-size: 58px;
  font-weight: 700;
  color: white;
  letter-spacing: -1px;
}

.hero p {
  margin-top: 20px;
  font-size: 18px;
  color: rgba(255,255,255,0.85);
  max-width: 650px;
  margin-left: auto;
  margin-right: auto;
}

.cta {
  margin-top: 30px;
  display: inline-block;
  padding: 14px 30px;
  border-radius: 999px;
  background: white;
  color: #111;
  font-weight: 600;
  text-decoration: none;
  transition: 0.3s;
}

.cta:hover {
  transform: translateY(-3px);
}

/* =========================
   REST OF YOUR STYLES (UNCHANGED)
========================= */

.section-title {
  text-align: center;
  font-size: 36px;
  font-weight: 700;
  margin: 80px 0 40px;
}

.glass {
  background: rgba(255,255,255,0.65);
  border: 1px solid rgba(255,255,255,0.4);
  backdrop-filter: blur(14px);
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.05);
  transition: 0.3s ease;
}

.glass:hover {
  transform: translateY(-6px);
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  margin: 60px auto;
  width: 92%;
  max-width: 1150px;
}

.stat {
  padding: 25px;
  text-align: center;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
  width: 92%;
  max-width: 1150px;
  margin: auto;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
  width: 92%;
  max-width: 1150px;
  margin: auto;
}

.profile img {
  width: 100%;
  height: 230px;
  object-fit: cover;
  border-radius: 20px 20px 0 0;
}

.profile-content {
  padding: 20px;
  text-align: center;
}

.meta {
  color: #5a5f6a;
  font-size: 14px;
}

.price {
  margin-top: 10px;
  font-weight: 600;
}

.book-btn {
  margin-top: 15px;
  display: inline-block;
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  background: #1c1c1e;
  color: white;
  text-decoration: none;
  font-weight: 500;
}

.book-btn:hover {
  background: #2c2c2e;
}

.feedback-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  width: 92%;
  max-width: 1150px;
  margin: auto;
}

.feedback {
  padding: 20px;
  font-style: italic;
}

.contact-box {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  width: 92%;
  max-width: 1150px;
  margin: auto;
}

input, textarea {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border-radius: 14px;
  border: 1px solid rgba(0,0,0,0.08);
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: #1c1c1e;
  color: white;
  font-weight: 500;
}

.map-section {
  margin: 90px 0;
  text-align: center;
}

.map-title {
  font-size: 34px;
  font-weight: 700;
  margin-bottom: 25px;
}

.map-box {
  width: 92%;
  max-width: 1150px;
  margin: auto;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,0.15);
}

.map-box iframe {
  width: 100%;
  height: 450px;
  border: 0;
}

@media (max-width: 768px) {
  .hero h1 { font-size: 34px; }
  .contact-box { grid-template-columns: 1fr; }
}

</style>
</head>

<body>

<!-- =========================
     HERO IMAGE
========================= -->
<section class="hero">

  <div>
    <h1>Modern psychological care for a balanced mind</h1>
    <p>Confidential therapy designed to help you find clarity, emotional stability, and inner calm.</p>
    <a href="#contact" class="cta">Book Appointment</a>
  </div>

</section>

<!-- (rest of your page stays exactly the same) -->

</body>
</html>
