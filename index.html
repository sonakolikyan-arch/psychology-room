<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Serenity Clinic</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   BASE
========================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  background: #f4f6f8;
  color: #1c1c1e;
  line-height: 1.6;
}

/* =========================
   HERO (NOW WITH BACKGROUND LAYER)
========================= */
.hero {
  position: relative;
  min-height: 92vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 120px 20px;
  overflow: hidden;
}

/* 🌿 HERO BACKGROUND IMAGE LAYER */
.hero-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: url("https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=2000&q=80") center/cover no-repeat;
  z-index: -3;
  filter: blur(0px) brightness(0.75) contrast(1.1);
}

/* 🎬 HERO VIDEO OVERLAY */
.hero video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
  filter: brightness(0.65) contrast(1.1);
}

/* overlay */
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(0,0,0,0.45),
    rgba(255,255,255,0.15)
  );
  z-index: -1;
}

.hero h1 {
  font-size: 58px;
  font-weight: 700;
  color: white;
}

.hero p {
  margin-top: 20px;
  font-size: 18px;
  color: rgba(255,255,255,0.85);
  max-width: 650px;
  margin: auto;
}

.cta {
  margin-top: 30px;
  display: inline-block;
  padding: 14px 30px;
  border-radius: 999px;
  background: white;
  color: #111;
  font-weight: 600;
  text-decoration: none;
}

/* =========================
   PSYCHOLOGIST IMAGE FIX
========================= */
.profile img {
  width: 100%;
  height: 230px;
  object-fit: cover;

  /* ⭐ IMPORTANT FIX: focus face properly */
  object-position: center 25%;
  
  border-radius: 20px 20px 0 0;
}

/* SPECIFIC FIX FOR ARMAN CARD (more precise crop) */
.profile.arman img {
  object-position: center 15%;
}

/* =========================
   REST (UNCHANGED)
========================= */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
}

.glass {
  background: rgba(255,255,255,0.65);
  border-radius: 20px;
  backdrop-filter: blur(14px);
}

/* BUTTON */
.book-btn {
  margin-top: 15px;
  display: inline-block;
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  background: #1c1c1e;
  color: white;
  text-decoration: none;
  text-align: center;
}

</style>
</head>

<body>

<!-- HERO -->
<section class="hero">

  <!-- 🌿 NEW BACKGROUND LAYER -->
  <div class="hero-bg"></div>

  <!-- 🎬 VIDEO -->
  <video autoplay muted loop playsinline>
    <source src="https://cdn.coverr.co/videos/coverr-a-woman-talking-to-a-therapist-7317/1080p.mp4">
  </video>

  <div>
    <h1>Modern psychological care</h1>
    <p>Confidential therapy designed to help you find clarity and emotional balance.</p>
    <a class="cta" href="#contact">Book Appointment</a>
  </div>

</section>

<!-- PSYCHOLOGISTS -->
<section>

  <div class="cards">

    <div class="glass profile">
      <img src="https://images.unsplash.com/photo-1559839734-2b71ea197ec2"/>
      <div class="profile-content">
        <h3>Dr. Anna Sargsyan</h3>
        <a class="book-btn">Book Appointment</a>
      </div>
    </div>

    <!-- ⭐ FIXED ARMAN IMAGE -->
    <div class="glass profile arman">
      <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d"/>
      <div class="profile-content">
        <h3>Dr. Arman Manukyan</h3>
        <a class="book-btn">Book Appointment</a>
      </div>
    </div>

  </div>

</section>

</body>
</html>
